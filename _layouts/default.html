<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · {{ site.company_name }}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
<style>
  /* Self-contained on purpose: no theme gem, no webfont, nothing to break a build
     or to fetch from a third party on a page about privacy. */
  :root {
    --text: #1a1a1a;
    --muted: #666;
    --rule: #e5e5e5;
    --link: #0b57d0;
    --bg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --text: #e8e8e8; --muted: #a0a0a0; --rule: #333; --link: #8ab4f8; --bg: #16181c; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 16px;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 2.5rem 0 4rem; }
  header.site { border-bottom: 1px solid var(--rule); padding-bottom: 1rem; margin-bottom: 2.5rem; }
  header.site a { color: var(--text); text-decoration: none; font-weight: 600; }
  h1 { font-size: 2rem; line-height: 1.25; margin: 0 0 1.5rem; }
  h2 { font-size: 1.35rem; margin: 2.5rem 0 .75rem; padding-top: .5rem; border-top: 1px solid var(--rule); }
  h3 { font-size: 1.1rem; margin: 1.75rem 0 .5rem; }
  a { color: var(--link); }
  ul, ol { padding-left: 1.4rem; }
  li { margin: .4rem 0; }
  em:first-of-type { color: var(--muted); }
  code { background: rgba(127,127,127,.15); padding: .1em .35em; border-radius: 3px; font-size: .9em; }
  footer.site {
    margin-top: 4rem; padding-top: 1.25rem; border-top: 1px solid var(--rule);
    color: var(--muted); font-size: .875rem;
  }
  footer.site a { color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a href="{{ site.baseurl }}/">{{ site.company_name }} Policies</a>
    </header>

    {{ content }}

    <footer class="site">
      <p>
        <a href="{{ site.baseurl }}/">All policies</a> ·
        <a href="{{ site.product_link }}">{{ site.product_url }}</a>
      </p>
      <!-- CC BY 4.0 requires attribution to the original author. These documents are
           adapted from 37signals' open-sourced policies; keep this notice. -->
      <p>
        Adapted from the <a href="https://github.com/basecamp/policies">37signals open-source policies</a>,
        used under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
        Changes have been made; 37signals does not endorse {{ site.company_name }}.
      </p>
    </footer>
  </div>
</body>
</html>
